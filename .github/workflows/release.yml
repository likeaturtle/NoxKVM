name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v0.4.9)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build Release
    outputs:
      version: ${{ steps.set-version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set version
        id: set-version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION=${{ inputs.version }}
            VERSION=${VERSION#v}
          else
            VERSION=${GITHUB_REF_NAME#v}
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Verify GPG setup
        run: |
          echo "=== GPG Version ==="
          gpg --version
          echo "=== List Secret Keys ==="
          if ! gpg --list-secret-keys --keyid-format=long | grep -q "sec"; then
            echo "Error: No GPG secret keys found. Check GPG_PRIVATE_KEY secret."
            exit 1
          fi
          echo "=== GPG secret keys found ==="
          gpg --list-secret-keys --keyid-format=long

      - name: Prepare Docker build context
        run: ./scripts/ci_helper.sh prepare

      - name: Set up Docker buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.DOCKER_BUILD_CONTEXT_DIR }}
          file: ${{ env.DOCKER_BUILD_CONTEXT_DIR }}/Dockerfile.build
          tags: ${{ env.DOCKER_BUILD_TAG }}
          push: false
          load: true

      - name: Cache CGO build
        uses: actions/cache@v5
        with:
          path: internal/native/cgo/build
          key: jetkvm-cgo-${{ hashFiles('internal/native/cgo/**/*.c', 'internal/native/cgo/**/*.h', 'internal/native/cgo/**/*.patch', 'internal/native/cgo/**/*.txt', 'internal/native/cgo/**/*.sh', '!internal/native/cgo/build/**') }}
          restore-keys: jetkvm-cgo-

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "**/package-lock.json"

      - name: Build frontend
        run: make frontend

      - name: Build release binary
        env:
          VERSION: ${{ steps.set-version.outputs.version }}
        run: ./scripts/ci_helper.sh make build_release VERSION=${{ steps.set-version.outputs.version }}

      - name: Generate SHA256 checksum
        run: |
          cd bin
          shasum -a 256 jetkvm_app | cut -d ' ' -f 1 > jetkvm_app.sha256

      - name: Sign binary with GPG
        run: |
          cd bin
          echo "=== Files in bin directory ==="
          ls -la
          echo "=== Getting GPG key ID ==="
          KEY_ID=$(gpg --list-secret-keys --keyid-format=long | grep -E "^sec" | awk '{print $2}' | cut -d'/' -f2)
          echo "Using key: $KEY_ID"
          if [ -z "$KEY_ID" ]; then
            echo "Error: No GPG key ID found"
            exit 1
          fi
          echo "=== Signing binary ==="
          gpg --batch --yes --detach-sign --local-user "$KEY_ID" --output jetkvm_app.sig jetkvm_app 2>&1
          echo "=== Checking result ==="
          ls -la jetkvm_app.sig || { echo "Signature file not created"; exit 1; }
          echo "Signature created successfully: jetkvm_app.sig"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: jetkvm-release
          path: |
            bin/jetkvm_app
            bin/jetkvm_app.sha256
            bin/jetkvm_app.sig

  release:
    needs: build
    runs-on: ubuntu-latest
    name: Create GitHub Release
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: jetkvm-release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build.outputs.version }}
          files: |
            jetkvm_app
            jetkvm_app.sha256
            jetkvm_app.sig
          generate_release_notes: true

  upload-cos:
    needs: [build, release]
    runs-on: ubuntu-latest
    name: Upload to Tencent COS
    env:
      COS_BASE_PATH: noxkvm/app
      COS_BUCKET: ${{ secrets.TENCENT_COS_BUCKET }}
      COS_REGION: ${{ secrets.TENCENT_COS_REGION }}
      COS_SECRET_ID: ${{ secrets.TENCENT_SECRET_ID }}
      COS_SECRET_KEY: ${{ secrets.TENCENT_SECRET_KEY }}
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: jetkvm-release

      - name: Install coscli
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o "$HOME/.local/bin/coscli" \
            "https://github.com/tencentyun/coscli/releases/download/v1.0.9/coscli-v1.0.9-linux-amd64"
          echo "a07de5ba2800147a700ed29036b0c76a4229088cee68e1682d0eae19b638a915  $HOME/.local/bin/coscli" | sha256sum -c -
          chmod 755 "$HOME/.local/bin/coscli"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Upload release to COS (versioned + latest)
        run: |
          VERSION=${{ needs.build.outputs.version }}
          # 无配置文件模式：--init-skip + 凭据走命令行，密钥不落盘
          COSCLI_AUTH=(--init-skip -i "$COS_SECRET_ID" -k "$COS_SECRET_KEY" -e "cos.${COS_REGION}.myqcloud.com")
          # 跨境链路单连接只有约 20KB/s。coscli 的 --part-size 默认 32MB，29.96MB 的产物会被切成
          # 1 片、单线程上传，一次卡顿整轮尝试就作废；改为 1MB 分片 + 16 并发分片。
          COSCLI_CP_OPTS=(--part-size 1 --thread-num 16 --err-retry-num 5 --err-retry-interval 5)
          for f in jetkvm_app jetkvm_app.sha256 jetkvm_app.sig; do
            # 二进制只跨境上传一次
            coscli "${COSCLI_AUTH[@]}" cp "${COSCLI_CP_OPTS[@]}" \
              "$f" "cos://${COS_BUCKET}/${COS_BASE_PATH}/${VERSION}/$f"
            # latest/ 走桶内服务端拷贝，不产生跨境流量
            coscli "${COSCLI_AUTH[@]}" cp \
              "cos://${COS_BUCKET}/${COS_BASE_PATH}/${VERSION}/$f" \
              "cos://${COS_BUCKET}/${COS_BASE_PATH}/latest/$f"
          done

      - name: Build OTA metadata
        env:
          COS_DOMAIN: ${{ secrets.TENCENT_COS_DOMAIN }}
        run: |
          VERSION=${{ needs.build.outputs.version }}
          if [ -z "$COS_DOMAIN" ]; then
            echo "TENCENT_COS_DOMAIN secret is required, e.g. dl.acenova.tech (no scheme)"
            exit 1
          fi
          COS_BASE="https://${COS_DOMAIN}"
          HASH_VALUE=$(cat jetkvm_app.sha256 | cut -d' ' -f1)

          cat > releases <<EOF
          {
            "appVersion": "${VERSION}",
            "appUrl": "${COS_BASE}/${COS_BASE_PATH}/latest/jetkvm_app",
            "appHash": "${HASH_VALUE}",
            "appSigUrl": "${COS_BASE}/${COS_BASE_PATH}/latest/jetkvm_app.sig",
            "systemVersion": "0.0.1",
            "systemUrl": "",
            "systemHash": ""
          }
          EOF

          echo "OTA metadata:"
          cat releases

      - name: Upload OTA metadata to COS
        run: |
          VERSION=${{ needs.build.outputs.version }}
          COSCLI_AUTH=(--init-skip -i "$COS_SECRET_ID" -k "$COS_SECRET_KEY" -e "cos.${COS_REGION}.myqcloud.com")
          coscli "${COSCLI_AUTH[@]}" cp --err-retry-num 5 --err-retry-interval 5 \
            releases "cos://${COS_BUCKET}/${COS_BASE_PATH}/${VERSION}/releases"
          coscli "${COSCLI_AUTH[@]}" cp \
            "cos://${COS_BUCKET}/${COS_BASE_PATH}/${VERSION}/releases" \
            "cos://${COS_BUCKET}/${COS_BASE_PATH}/latest/releases"

  update-cos-index:
    needs: [build, release, upload-cos]
    runs-on: ubuntu-latest
    name: Trigger cos-index-repo update
    steps:
      - name: Dispatch workflow
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.COS_INDEX_PAT }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: 'likeaturtle',
              repo: 'cos-index-repo',
              workflow_id: 'update-cos-index.yml',
              ref: 'main'
            });
