name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 0.4.9)'
        required: true
        type: string
      upload_to_tos:
        description: 'Upload to Volcengine TOS'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build Release
    outputs:
      version: ${{ steps.set-version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set version
        id: set-version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION=${{ inputs.version }}
          else
            VERSION=${GITHUB_REF_NAME#v}
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Verify GPG setup
        run: |
          echo "=== GPG Version ==="
          gpg --version
          echo "=== List Secret Keys ==="
          if ! gpg --list-secret-keys --keyid-format=long | grep -q "sec"; then
            echo "Error: No GPG secret keys found. Check GPG_PRIVATE_KEY secret."
            exit 1
          fi
          echo "=== GPG secret keys found ==="
          gpg --list-secret-keys --keyid-format=long

      - name: Prepare Docker build context
        run: ./scripts/ci_helper.sh prepare

      - name: Set up Docker buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.DOCKER_BUILD_CONTEXT_DIR }}
          file: ${{ env.DOCKER_BUILD_CONTEXT_DIR }}/Dockerfile.build
          tags: ${{ env.DOCKER_BUILD_TAG }}
          push: false
          load: true

      - name: Cache CGO build
        uses: actions/cache@v5
        with:
          path: internal/native/cgo/build
          key: jetkvm-cgo-${{ hashFiles('internal/native/cgo/**/*.c', 'internal/native/cgo/**/*.h', 'internal/native/cgo/**/*.patch', 'internal/native/cgo/**/*.txt', 'internal/native/cgo/**/*.sh', '!internal/native/cgo/build/**') }}
          restore-keys: jetkvm-cgo-

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "**/package-lock.json"

      - name: Build frontend
        run: make frontend

      - name: Build release binary
        env:
          VERSION: ${{ steps.set-version.outputs.version }}
        run: ./scripts/ci_helper.sh make build_release VERSION=${{ steps.set-version.outputs.version }}

      - name: Generate SHA256 checksum
        run: |
          cd bin
          shasum -a 256 jetkvm_app | cut -d ' ' -f 1 > jetkvm_app.sha256

      - name: Sign binary with GPG
        run: |
          cd bin
          echo "=== Files in bin directory ==="
          ls -la
          echo "=== Getting GPG key ID ==="
          KEY_ID=$(gpg --list-secret-keys --keyid-format=long | grep -E "^sec" | awk '{print $2}' | cut -d'/' -f2)
          echo "Using key: $KEY_ID"
          if [ -z "$KEY_ID" ]; then
            echo "Error: No GPG key ID found"
            exit 1
          fi
          echo "=== Signing binary ==="
          gpg --batch --yes --detach-sign --local-user "$KEY_ID" --output jetkvm_app.sig jetkvm_app 2>&1
          echo "=== Checking result ==="
          ls -la jetkvm_app.sig || { echo "Signature file not created"; exit 1; }
          echo "Signature created successfully: jetkvm_app.sig"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: jetkvm-release
          path: |
            bin/jetkvm_app
            bin/jetkvm_app.sha256
            bin/jetkvm_app.sig

  release:
    needs: build
    runs-on: ubuntu-latest
    name: Create GitHub Release
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: jetkvm-release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build.outputs.version }}
          files: |
            jetkvm_app
            jetkvm_app.sha256
            jetkvm_app.sig
          generate_release_notes: true

  # Upload release artifacts to Volcengine TOS (optional)
  upload-tos:
    needs: [build, release]
    if: ${{ github.event.inputs.upload_to_tos != 'false' }}
    uses: ./.github/workflows/upload-tos.yml
    with:
      version: ${{ needs.build.outputs.version }}
      artifact_name: jetkvm-release
    secrets:
      TOS_ACCESS_KEY: ${{ secrets.TOS_ACCESS_KEY }}
      TOS_SECRET_KEY: ${{ secrets.TOS_SECRET_KEY }}

  # Generate and deploy OTA update metadata to GitHub Pages
  deploy-pages:
    needs: [build, release]
    runs-on: ubuntu-latest
    name: Deploy OTA Metadata to GitHub Pages
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Get release info
        id: release-info
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=${{ needs.build.outputs.version }}
          REPO="${{ github.repository }}"
          
          # Get release upload URL and asset URLs
          RELEASE_DATA=$(gh api repos/${REPO}/releases/tags/v${VERSION})
          
          # Extract asset browser download URLs (these are publicly accessible)
          APP_URL=$(echo "$RELEASE_DATA" | jq -r '.assets[] | select(.name == "jetkvm_app") | .browser_download_url')
          SIG_URL=$(echo "$RELEASE_DATA" | jq -r '.assets[] | select(.name == "jetkvm_app.sig") | .browser_download_url')
          HASH_URL=$(echo "$RELEASE_DATA" | jq -r '.assets[] | select(.name == "jetkvm_app.sha256") | .browser_download_url')
          
          # Download hash file to get the actual hash value
          HASH_VALUE=$(curl -sL "${HASH_URL}" | cut -d' ' -f1)
          
          echo "app_url=${APP_URL}" >> $GITHUB_OUTPUT
          echo "sig_url=${SIG_URL}" >> $GITHUB_OUTPUT
          echo "hash=${HASH_VALUE}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Generate OTA metadata
        run: |
          mkdir -p ./pages
          
          cat > ./pages/releases << EOF
          {
            "appVersion": "${{ steps.release-info.outputs.version }}",
            "appUrl": "${{ steps.release-info.outputs.app_url }}",
            "appHash": "${{ steps.release-info.outputs.hash }}",
            "appSigUrl": "${{ steps.release-info.outputs.sig_url }}",
            "systemVersion": "0.0.1",
            "systemUrl": "",
            "systemHash": ""
          }
          EOF
          
          # Also create a latest.json for convenience
          cp ./pages/releases ./pages/latest.json
          
          cat ./pages/releases

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
